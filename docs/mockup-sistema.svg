<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" font-family="Arial, sans-serif">
  <rect width="940" height="620" fill="#f8fafc"/>

  <text x="40" y="46" font-size="22" font-weight="bold" fill="#0f172a">SkyOps — como funciona el sistema</text>
  <text x="40" y="70" font-size="13" fill="#64748b">Recorrido de una recuperacion AOG, desde que se detecta el avion detenido hasta que queda el registro.</text>

  <!-- ===== PASO 1 ===== -->
  <rect x="40" y="100" width="164" height="96" rx="8" fill="#0f172a"/>
  <text x="56" y="126" font-size="11" fill="#38bdf8">PASO 1</text>
  <text x="56" y="148" font-size="15" font-weight="bold" fill="#ffffff">Flota</text>
  <text x="56" y="169" font-size="11" fill="#94a3b8">Se ve que avion esta</text>
  <text x="56" y="184" font-size="11" fill="#94a3b8">detenido (AOG).</text>

  <!-- ===== PASO 2 ===== -->
  <rect x="238" y="100" width="164" height="96" rx="8" fill="#0f172a"/>
  <text x="254" y="126" font-size="11" fill="#38bdf8">PASO 2</text>
  <text x="254" y="148" font-size="15" font-weight="bold" fill="#ffffff">Catalogo</text>
  <text x="254" y="169" font-size="11" fill="#94a3b8">Se busca el repuesto</text>
  <text x="254" y="184" font-size="11" fill="#94a3b8">por P/N, S/N o ATA.</text>

  <!-- ===== PASO 3 ===== -->
  <rect x="436" y="100" width="164" height="96" rx="8" fill="#0f172a"/>
  <text x="452" y="126" font-size="11" fill="#38bdf8">PASO 3</text>
  <text x="452" y="148" font-size="15" font-weight="bold" fill="#ffffff">Manifiesto</text>
  <text x="452" y="169" font-size="11" fill="#94a3b8">Se juntan las piezas</text>
  <text x="452" y="184" font-size="11" fill="#94a3b8">de la orden.</text>

  <!-- ===== PASO 4 ===== -->
  <rect x="634" y="100" width="164" height="96" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="2"/>
  <text x="650" y="126" font-size="11" fill="#eab308">PASO 4</text>
  <text x="650" y="148" font-size="15" font-weight="bold" fill="#ffffff">Despacho AOG</text>
  <text x="650" y="169" font-size="11" fill="#94a3b8">Se valida y se</text>
  <text x="650" y="184" font-size="11" fill="#94a3b8">autoriza la salida.</text>

  <!-- ===== PASO 5 ===== -->
  <rect x="634" y="252" width="164" height="96" rx="8" fill="#0f172a"/>
  <text x="650" y="278" font-size="11" fill="#38bdf8">PASO 5</text>
  <text x="650" y="300" font-size="15" font-weight="bold" fill="#ffffff">Bitacora</text>
  <text x="650" y="321" font-size="11" fill="#94a3b8">Queda el registro con</text>
  <text x="650" y="336" font-size="11" fill="#94a3b8">folio y responsable.</text>

  <!-- flechas horizontales -->
  <g stroke="#0284c7" stroke-width="2" fill="none">
    <path d="M204 148 L232 148" marker-end="url(#punta)"/>
    <path d="M402 148 L430 148" marker-end="url(#punta)"/>
    <path d="M600 148 L628 148" marker-end="url(#punta)"/>
    <path d="M716 196 L716 246" marker-end="url(#punta)"/>
  </g>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- ===== VALIDACIONES ===== -->
  <rect x="40" y="252" width="560" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="276" font-size="13" font-weight="bold" fill="#0f172a">Que revisa el Despacho antes de dejar pasar</text>
  <text x="58" y="299" font-size="11.5" fill="#334155">Matricula: 6 caracteres, parte con CC- y termina en tres letras (CC-BFA).</text>
  <text x="58" y="317" font-size="11.5" fill="#334155">Licencia: dos letras, guion y cuatro numeros (LE-3401). Destino: obligatorio.</text>
  <text x="58" y="335" font-size="11.5" fill="#334155">Ingeniero: nombre y apellido. Declaracion de responsabilidad: marcada.</text>

  <!-- ===== DONDE SE GUARDA ===== -->
  <rect x="40" y="392" width="758" height="118" rx="8" fill="#1e293b"/>
  <text x="58" y="418" font-size="13" font-weight="bold" fill="#38bdf8">Donde se guardan los datos: localStorage del navegador</text>
  <text x="58" y="440" font-size="11" fill="#94a3b8">No hay base de datos todavia. Cada pagina lee y escribe estas cuatro llaves con js/datos.js.</text>

  <rect x="58" y="454" width="168" height="40" rx="5" fill="#0f172a"/>
  <text x="70" y="472" font-size="11" font-weight="bold" fill="#ffffff">skyops_catalogo</text>
  <text x="70" y="487" font-size="10" fill="#64748b">las piezas de bodega</text>

  <rect x="242" y="454" width="168" height="40" rx="5" fill="#0f172a"/>
  <text x="254" y="472" font-size="11" font-weight="bold" fill="#ffffff">skyops_flota</text>
  <text x="254" y="487" font-size="10" fill="#64748b">los aviones y su estado</text>

  <rect x="426" y="454" width="168" height="40" rx="5" fill="#0f172a"/>
  <text x="438" y="472" font-size="11" font-weight="bold" fill="#ffffff">skyops_manifiesto</text>
  <text x="438" y="487" font-size="10" fill="#64748b">la orden abierta</text>

  <rect x="610" y="454" width="168" height="40" rx="5" fill="#0f172a"/>
  <text x="622" y="472" font-size="11" font-weight="bold" fill="#ffffff">skyops_bitacora</text>
  <text x="622" y="487" font-size="10" fill="#64748b">los despachos hechos</text>

  <!-- ===== ROLES ===== -->
  <rect x="822" y="100" width="118" height="248" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="838" y="126" font-size="12" font-weight="bold" fill="#0f172a">Quien usa</text>

  <circle cx="846" cy="152" r="4" fill="#ef4444"/>
  <text x="858" y="156" font-size="11" font-weight="bold" fill="#334155">Ingeniero</text>
  <text x="838" y="171" font-size="10" fill="#64748b">de linea: pide</text>
  <text x="838" y="184" font-size="10" fill="#64748b">los repuestos.</text>

  <circle cx="846" cy="212" r="4" fill="#eab308"/>
  <text x="858" y="216" font-size="11" font-weight="bold" fill="#334155">Bodega</text>
  <text x="838" y="231" font-size="10" fill="#64748b">despacha la</text>
  <text x="838" y="244" font-size="10" fill="#64748b">pieza a rampa.</text>

  <circle cx="846" cy="272" r="4" fill="#16a34a"/>
  <text x="858" y="276" font-size="11" font-weight="bold" fill="#334155">Jefe de</text>
  <text x="838" y="291" font-size="10" fill="#64748b">mantenimiento:</text>
  <text x="838" y="304" font-size="10" fill="#64748b">revisa la</text>
  <text x="838" y="317" font-size="10" fill="#64748b">bitacora.</text>

  <text x="40" y="548" font-size="11" fill="#64748b">DSY1104 Desarrollo Full Stack II — Duoc UC — Agustin Boeri y Cristian Rivera</text>
</svg>
